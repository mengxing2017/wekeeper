name: Rust and React

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            api-contract/pnpm-lock.yaml
      - run: make install
      - run: make check-web

  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_DB: wekeeper_test
          POSTGRES_USER: wekeeper_test
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wekeeper_test -d wekeeper_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WEKEEPER_TEST_DATABASE_URL: postgres://wekeeper_test:ci-disposable-password@127.0.0.1:5432/wekeeper_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: make check-backend
      - run: make test-integration
      - run: make test-embedded
        timeout-minutes: 5

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp env.example .env
      - run: make compose-config
      - run: docker compose --env-file .env -f compose.yaml -f compose.dev.yaml up --build --wait --wait-timeout 180
      - run: make smoke
      - if: failure()
        run: docker compose --env-file .env -f compose.yaml -f compose.dev.yaml logs --no-color
      - if: always()
        run: docker compose --env-file .env -f compose.yaml -f compose.dev.yaml down --volumes
